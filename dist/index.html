<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#182653">
  <meta name="description" content="A playful, interactive Lemrix surfing animation with collectible card trails.">
  <title>Lemrix — Surfing Animation</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/lemrix-cursor-surf.css?v=animated-6">
  <script src="/lemrix-cursor-surf.js?v=animated-6" defer></script>
</head>
<body>
  <main id="lemrix-world" aria-label="Lemrix surfing: move your pointer to surf, boost, turn and jump.">

    <div id="lemrix-mover" data-state="idle" aria-hidden="true">
      <div id="lemrix-rig">
