    ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);ctx.globalAlpha*=alpha;
    // Rounded plate plus navy bottom-edge thickness.
    function roundRect(x,y,ww,hh,r){ctx.beginPath();ctx.roundRect(x,y,ww,hh,r);}
    ctx.fillStyle='#101f55';roundRect(-w*.5+1,-h*.5+3,w,h,Math.max(2,h*.1));ctx.fill();
    ctx.fillStyle='#3567bf';roundRect(-w*.5,-h*.5,w,h,Math.max(2,h*.12));ctx.fill();
    ctx.strokeStyle='#102257';ctx.lineWidth=Math.max(1.4,w*.016);ctx.stroke();
    // Exposed lower edge makes each card in the deck individually legible.
    ctx.beginPath();ctx.moveTo(-w*.5+5,h*.5+2.2);ctx.lineTo(w*.5-5,h*.5+2.2);
    ctx.strokeStyle='#84addf';ctx.lineWidth=Math.max(1.2,w*.010);ctx.stroke();
    ctx.fillStyle='#1d459a';roundRect(-w*.5+4,-h*.5+4,w-8,h-8,Math.max(2,h*.11));ctx.fill();
    ctx.strokeStyle='#8cbcf0';ctx.lineWidth=Math.max(1.1,w*.011);ctx.stroke();
    // Icon is simplified at small sizes to keep particles unobtrusive.
    if(front){
      const rad=Math.max(2,Math.min(w*.125,h*.28));
      ctx.save();ctx.rotate(.12);
      ctx.fillStyle='#e8f1ff';ctx.beginPath();ctx.arc(0,0,rad+1.5,0,TAU);ctx.fill();
      ctx.fillStyle='#e95c55';ctx.beginPath();ctx.arc(0,0,rad,Math.PI,TAU);ctx.fill();
      ctx.fillStyle='#edf2fa';ctx.beginPath();ctx.arc(0,0,rad,0,Math.PI);ctx.fill();
      ctx.strokeStyle='#1c275a';ctx.lineWidth=Math.max(1.4,rad*.19);ctx.beginPath();ctx.moveTo(-rad,0);ctx.lineTo(rad,0);ctx.stroke();
      ctx.beginPath();ctx.arc(0,0,rad*.27,0,TAU);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }
  // Stack: the cards are in persistent slots, but when a card ejects the slots
  // slide down and a replacement cards feeds in at the top within the same cycle.
  const engine={acc:0,phase:0,pulse:0,ejected:0,lastFrequency:0};
  function spawnCard(x,y,vx,vy,t,boost){
    const mag=Math.hypot(vx,vy)||1;
    const nx=vx/mag,ny=vy/mag;
    const velocity=clamp(mag,80,1650);
    // Always propelled opposite Lemrix's actual movement vector.
    cards.push({x,y,vx:-nx*(125+velocity*.43)+(-ny)*25,
      vy:-ny*(125+velocity*.43)+nx*25+70,rot:-.18+Math.random()*.36,
      vr:(Math.random()-.5)*(boost?10:6),start:t,life:boost?830:710,
      size:.58+Math.random()*.1});
    engine.pulse=1;engine.ejected++;
    if(cards.length>26)cards.shift();
  }
  function updateEngine(t,dt){
    // Ejection frequency is based on ACTUAL rider velocity, not cursor jitter.
    const v=Math.hypot(rider.vx,rider.vy);
    const moving=pointer.seen&&t-pointer.lastAt<340&&v>25;
    const hz=moving?clamp(.55+v/87,.55,12.5):0;
    engine.lastFrequency=smooth(engine.lastFrequency,hz,9,dt);
    engine.pulse=Math.max(0,engine.pulse-dt*7);
    if(engine.lastFrequency>.3&&moving){
      engine.acc+=dt*engine.lastFrequency;
      for(let i=0;i<3&&engine.acc>=1;i++){
        engine.acc-=1;
        const b=boardCentre(t);
        const rear= rdir();
        spawnCard(b.x-rear.x*70,b.y+10-rear.y*9,rider.vx,rider.vy,t,rider.state==='boost');
      }
      engine.phase=engine.acc;
    }else{engine.acc=0;engine.phase=0;}
  }
  function rdir(){const len=Math.hypot(rider.vx,rider.vy)||1;return{x:(rider.vx/len),y:(rider.vy/len)};}
  function boardCentre(t){const sz=spriteSize();return{x:rider.x,y:rider.y+sz*.17+rider.jump};}

  function renderBoard(t){
    const size=spriteSize();const s=size/178;
    const b=boardCentre(t);
    const spd=Math.hypot(rider.vx,rider.vy);
    const isBoost=rider.state==='boost';
    const amp=(.013+Math.min(spd/1200,1)*.060);
    const wav=Math.sin(t*.011)*amp+Math.sin(t*.023)*amp*.35;
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(rider.bank*.67+wav);
    // Draw lowest first; thirteen dark blue edges stack into a flexible board.
    const count=15;
    const phase=engine.phase;
    const baseW=(136+Math.min(spd/95,12))*s,baseH=52*s;
    for(let i=0;i<count;i++){
      const depth=i/(count-1);
      const direction=(i-count/2)*.010;
      const bend=Math.sin(t*.013+depth*3.8)*amp*1.35;
      const feed=phase>0?phase:0;
      const peel=i===0&&engine.lastFrequency>.5?feed:0;
      const travel=rdir();
      // Bottom card is expelled in the true opposite direction of travel.
      const slideX= -travel.x*peel*54*s;
      const slideY= -travel.y*peel*38*s+peel*8*s;
      const wobble=(.8-depth)*Math.sin(t*.015-depth*2.6)*2.7*s;
      const x=(i-count*.5)*2.9*s+slideX+Math.sin(t*.004+depth*2)*1.9*s;
      const y=(count-1-i)*2.85*s-19*s + wobble+slideY;
      paintCard(x,y,baseW*(.95+depth*.08)*(1-peel*.33),baseH*.67*(1-peel*.18),
        direction+bend-peel*.19*(travel.x||1),1-peel*.58,i>=count-3||i===0);
    }
    // A new top card enters ahead of the stack when a bottom card peels off.
    // The deck visibly restocks, while never losing its overall silhouette.
    if(engine.lastFrequency>.5){
      const slide=phase;
      paintCard(18*s+((1-slide)*14*s),-20*s-(1-slide)*9*s,baseW*1.02,baseH*.67,
        -.04+(1-slide)*.055,Math.min(1,slide*2.6),true);
    }
    ctx.restore();
  }

  function renderParticles(t,dt){
    for(let i=cards.length-1;i>=0;i--){
      const p=cards[i];const age=t-p.start;if(age>p.life){cards.splice(i,1);continue;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      p.vy+=110*dt;p.vx*=Math.exp(-dt*1.55);p.vy*=Math.exp(-dt*.8);
      p.rot+=p.vr*dt;
      const u=age/p.life;
      const a=(u<.12?u/.12:1)*Math.pow(1-u,1.6)*.85;
      ctx.save();ctx.translate(p.x,p.y);ctx.scale(lerp(p.size,.23,u),lerp(p.size,.23,u));
      paintCard(0,0,70,38,p.rot,a,true);ctx.restore();
    }
  }
  function renderMascot(t){
    const size=spriteSize();const sz=size;
    const airborne=rider.state==='jump'||rider.state==='land';
    const wobble=Math.sin(t*.0048)* (rider.state==='idle'?3.6:1.2);
    ctx.save();ctx.translate(rider.x,rider.y+rider.jump+wobble);
    // Body slightly opposes the board's bend; this sells balance and weight.
    ctx.rotate(rider.bank*.34+(rider.state==='boost'?-.055:0));
    const sq=rider.state==='boost'?.94:rider.state==='land'?.97:1;
    ctx.scale(rider.face,sq);
    const imgIndex=getFrame(t);
    if(sheet.complete&&sheet.naturalWidth){
      const sw=sheet.naturalWidth/4,sh=sheet.naturalHeight/2;
      const f=imgIndex;
      // Normalise feet and body centre across all hand-drawn poses.
      // Without this, a jump or boost frame appears to clip or teleport.
      const foot=[238,231,220,208,221,217,175,220][f];
      const centre=[150,131,140,177,145,145,140,142][f];
      const dx=-sz*(centre/300);
      const dy=-sz*(foot/300);
      ctx.drawImage(sheet,(f%4)*sw,Math.floor(f/4)*sh,sw,sh,dx,dy,sz,sz);
    }else{
      // Resilient placeholder until artwork loads.
      ctx.fillStyle='#8cddfa';ctx.strokeStyle='#14254f';ctx.lineWidth=3;
      ctx.beginPath();ctx.ellipse(0,-sz*.33,sz*.31,sz*.40,0,0,TAU);ctx.fill();ctx.stroke();
    }
    // Very small finger reach toward the real pointer, separate from surfing sprite.
    // Hidden when idle, so the hand remains relaxed and no fake click target appears.
    const vx=pointer.x-rider.x,vy=pointer.y-rider.y;
    const reach=Math.hypot(vx,vy);
    if(pointer.seen&&rider.state!=='idle'&&reach>17){
      const scale=size/178;const maxReach=23*scale;
      const ux=vx/reach,uy=vy/reach;
      const hx=sz*.22,hy=-sz*.28;
      const length=Math.min(maxReach,reach*.25);
      ctx.lineCap='round';ctx.strokeStyle='#142458';ctx.lineWidth=10*scale;
      ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx+ux*length,hy+uy*length);ctx.stroke();
      ctx.strokeStyle='#7acbed';ctx.lineWidth=6.3*scale;ctx.beginPath();ctx.moveTo(hx,hy);
      ctx.lineTo(hx+ux*length,hy+uy*length);ctx.stroke();
      if(t<pointer.downUntil){
        const px=hx+ux*(length+8*scale),py=hy+uy*(length+8*scale);
        ctx.strokeStyle='#152654';ctx.lineWidth=3*scale;
        ctx.beginPath();ctx.moveTo(hx+ux*length,hy+uy*length);ctx.lineTo(px,py);ctx.stroke();
        ctx.strokeStyle='#97e4fd';ctx.lineWidth=1.6*scale;ctx.stroke();
      }
    }
    ctx.restore();
  }
  function update(t){
    const dt=clamp((t-(last||t))/1000,0,.038);last=t;
    if(t-pointer.lastAt>190){pointer.vx*=Math.exp(-13*dt);pointer.vy*=Math.exp(-13*dt);pointer.speed=Math.hypot(pointer.vx,pointer.vy);pointer.heading=null;}
    // A deliberately slow critically damped spring gives Lemrix weight and momentum.
    const omega=7.4;
    rider.vx+=((pointer.x-rider.x)*omega*omega-2*omega*rider.vx)*dt;
    rider.vy+=((pointer.y-rider.y)*omega*omega-2*omega*rider.vy)*dt;
    rider.x+=rider.vx*dt;rider.y+=rider.vy*dt;
    updateState(t);
    if(Math.abs(pointer.vx)>45)rider.face=pointer.vx>=0?1:-1;
    const desiredBank=rider.state==='turn'?rider.turnDir*.24:clamp(pointer.vx/2100,-.10,.10);
    rider.bank=smooth(rider.bank,desiredBank,9,dt);
    const nowJump=rider.jumpAt>0&&rider.state==='jump';
    const lift=nowJump?-Math.sin(Math.min(1,(t-rider.jumpAt)/520)*Math.PI*.76)*45:0;
    rider.jump=smooth(rider.jump,lift,rider.state==='land'?11:9,dt);
    updateEngine(t,dt);
    ctx.clearRect(0,0,width,height);
    renderParticles(t,dt);
    // Board below Lemrix: top cards are never baked into his body frames.
    renderBoard(t);
    renderMascot(t);
    requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
})();
</script></body>
</html>
