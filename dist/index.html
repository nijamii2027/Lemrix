  // A website-friendly cursor footprint: ~105px Lemrix, ~120px card deck at desktop size.
  // Query ?preview=large can enlarge the artwork for sprite-review without changing behaviour.
  const params = new URLSearchParams(location.search);
  const websiteSize = params.get('size') === 'website';
  const previewLarge = params.get('preview') === 'large';
  const scaleSize = () => websiteSize ? clamp(Math.min(vw*.16,vh*.20),88,126)
    : previewLarge ? clamp(Math.min(vw*.29,vh*.40),200,280)
    : vw < 640 ? clamp(Math.min(vw*.28,vh*.22),92,126)
    : clamp(Math.min(vw*.175,vh*.245),124,168);
  const cursor={x:vw*.5,y:vh*.48,oldX:vw*.5,oldY:vh*.48,t:0,raw:0,vx:0,vy:0,heading:null,seen:false,downUntil:0};
  const rider={x:cursor.x,y:cursor.y,vx:0,vy:0,bank:0,face:1,jump:0,squash:1,
    state:'idle',at:0,turnUntil:0,turnSign:1,turnCooldown:0,
    boostUntil:0,jumpStarted:0,landStarted:0,nextJump:0,clickUntil:0};
  const particles=[];const engine={phase:0,acc:0,speed:0,hz:0,produced:0};
  const maxTrailCards = 11;
  let last=0, lastClock=0, lastDirection={x:1,y:0}, lastFrame=0;
  const sequence={
    idle:[0,1,2,3,4,5,4,2,1,0],
    surf:[6,7,8,9,10,11],
    boost:[12,13,14,15,16,17],
    turn:[14,15,16,17,16,15],
    jump:[18,19,20],
    land:[21,0],
    click:[22,23,23,22]
  };
  const frameMs={idle:185,surf:110,boost:72,turn:96,jump:118,land:116,click:75};

  function onPointer(x,y){
    if(!Number.isFinite(x)||!Number.isFinite(y))return;
    const t=performance.now();x=clamp(x,0,vw);y=clamp(y,0,vh);
    if(cursor.t){
      const dt=clamp((t-cursor.t)/1000,.011,.12);
      const dx=x-cursor.oldX,dy=y-cursor.oldY;
      const rvx=clamp(dx/dt,-3400,3400),rvy=clamp(dy/dt,-3400,3400);
      cursor.vx=approach(cursor.vx,rvx,19,dt);
      cursor.vy=approach(cursor.vy,rvy,19,dt);
      cursor.raw=Math.hypot(rvx,rvy);
      const v=Math.hypot(cursor.vx,cursor.vy);
      if(cursor.raw>980||(v>810&&cursor.raw>680))rider.boostUntil=t+290;
      // Upward swipe launches Lemrix; the board and body travel together.
      if(dy< -4&&rvy<-230&&t>rider.nextJump){
        rider.jumpStarted=t;
        rider.landStarted=0;
        rider.nextJump=t+850;
      }
      // Turns are deliberate direction changes rather than noisy single-pixel movements.
      if(cursor.raw>290&&Math.hypot(dx,dy)>7){
        const h=Math.atan2(rvy,rvx);
        if(cursor.heading !== null&&t>rider.turnCooldown){
          const d=Math.atan2(Math.sin(h-cursor.heading),Math.cos(h-cursor.heading));
          if(Math.abs(d)>.73){
            rider.turnSign=Math.sign(d)||1;rider.turnUntil=t+320;rider.turnCooldown=t+390;
          }
        }
        cursor.heading=h;
      }
    }
    cursor.x=x;cursor.y=y;cursor.oldX=x;cursor.oldY=y;cursor.t=t;cursor.seen=true;
  }
  window.addEventListener('pointermove',e=>onPointer(e.clientX,e.clientY),{passive:true});
  if(!window.PointerEvent) window.addEventListener('mousemove',e=>onPointer(e.clientX,e.clientY),{passive:true});
  window.addEventListener('touchmove',e=>{if(e.touches[0])onPointer(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  window.addEventListener('pointerdown',()=>{const now=performance.now();cursor.downUntil=now+245;rider.clickUntil=now+245;},{passive:true});
  window.addEventListener('blur',()=>{cursor.vx=0;cursor.vy=0;});

  function transition(name,t){
    if(rider.state===name)return;
    rider.state=name;rider.at=t;
  }
  function chooseState(now){
    const active=now-cursor.t<190;
    const travelling=Math.hypot(rider.vx,rider.vy);
    const remaining=Math.hypot(rider.x-cursor.x,rider.y-cursor.y);
    if(now<rider.clickUntil){transition('click',now);return;}
    if(rider.jumpStarted){
      const age=now-rider.jumpStarted;
      const stillRising=active&&cursor.vy<-105;
      if(age<340||(age<790&&stillRising)){transition('jump',now);return;}
      if(!rider.landStarted)rider.landStarted=now;
      if(now-rider.landStarted<290){transition('land',now);return;}
      rider.jumpStarted=0;rider.landStarted=0;
    }
    if(now<rider.turnUntil&&active){transition('turn',now);return;}
    if(now<rider.boostUntil&&active){transition('boost',now);return;}
    if(travelling<29&&remaining<12){transition('idle',now);return;}
    transition('surf',now);
  }
  function whichFrame(now){
    const seq=sequence[rider.state];
    const index=Math.floor(Math.max(0,now-rider.at)/frameMs[rider.state])%seq.length;
    return seq[index];
  }
  function drawAtlas(which,frame,x,y,size,opacity=1){
    const img=images[which];if(!img.complete||!img.naturalWidth)return;
    const sx=(frame%COLS)*WORLD,sy=Math.floor(frame/COLS)*WORLD;
    ctx.save();ctx.globalAlpha*=opacity;
    ctx.drawImage(img,sx,sy,WORLD,WORLD,x-size*.5,y-size*.70,size,size);
    ctx.restore();
  }
  function drawCard(x,y,size,ang,alpha=1,squish=1){
    const img=images.card;
    if(!img.complete||!img.naturalWidth||alpha<=.002)return;
    ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.globalAlpha*=alpha;
    ctx.scale(1,squish);
    // A full, unmistakable blue trading card back with white edging and Poké Ball art.
    ctx.drawImage(img,-size*.5,-size*.5,size,size);
    ctx.restore();
  }
  function emitBottomCard(now,size,speed){
    const magnitude=Math.hypot(rider.vx,rider.vy)||1;
    const dx=(Math.abs(rider.vx)+Math.abs(rider.vy)>5)?rider.vx/magnitude:lastDirection.x;
    const dy=(Math.abs(rider.vx)+Math.abs(rider.vy)>5)?rider.vy/magnitude:lastDirection.y;
    lastDirection={x:dx,y:dy};
    // Origin precisely at the under-rear of the moving deck.
    const w=size*1.29;
    const rearX=rider.x-rider.face*w*.42;
    const rearY=rider.y+rider.jump+size*.22;
    const force=clamp(125+speed*.45,135,540);
    const perpendicular={x:-dy,y:dx};
    const drift=(Math.random()-.5)*22;
    const p={x:rearX,y:rearY,vx:-dx*force+perpendicular.x*drift,
      vy:-dy*force+perpendicular.y*drift+15,
      rotation:(Math.random()-.5)*.19,
      angular:(Math.random()-.5)*4.6,
      created:now,duration:clamp(820-speed*.12,510,820),
      size:size*(.195+Math.random()*.025)};
    particles.push(p);engine.produced++;
    if(particles.length>maxTrailCards)particles.splice(0,particles.length-maxTrailCards);
  }
  function updateEngine(now,dt,size){
    const movement=Math.hypot(rider.vx,rider.vy);
    const recent=now-cursor.t<330;
    const speed=(recent&&movement>72)?movement:0;
    engine.speed=approach(engine.speed,speed,13,dt);
    // Card propulsion scales with rider velocity. Never eject while idle.
    const hz=speed>0?clamp(1.5+speed/118,2.1,12):0;
    engine.hz=approach(engine.hz,hz,hz>0?12:17,dt);
    if(hz>0){
      engine.acc+=engine.hz*dt;
      let n=0;
      while(engine.acc>=1&&n<3){engine.acc--;n++;emitBottomCard(now,size,speed);}
      engine.phase=engine.acc;
    } else {engine.acc=0;engine.phase=0;}
  }
  function drawDetached(now,dt){
    for(let i=particles.length-1;i>=0;i--){
      const c=particles[i],age=now-c.created;
      if(age>c.duration){particles.splice(i,1);continue;}
      c.x+=c.vx*dt;c.y+=c.vy*dt;
      c.vx*=Math.exp(-1.1*dt);c.vy=c.vy*Math.exp(-.85*dt)+64*dt;
      c.rotation+=c.angular*dt;
      const progress=clamp(age/c.duration,0,1);
      const alpha=Math.min(1,progress/.09)*Math.pow(1-progress,1.45)*.86;
      // Readable card backs remain close to the surf wake and fade quickly.
      drawCard(c.x,c.y,c.size*(1-progress*.26),c.rotation,alpha);
    }
  }
  function drawBoardMechanism(now,size){
    const deck=images.deck;
    if(!deck.complete||!deck.naturalWidth)return;
    const w=size*1.29,h=w*deck.naturalHeight/deck.naturalWidth;
    const isMoving=engine.speed>30 && rider.state!=='idle';
    const phase=engine.phase;
    const wobble=Math.sin(now*.008)*(.009+clamp(engine.speed/3200,0,.022));
    const carve=rider.state==='turn'? Math.sin(now*.018)*.017:0;
    const angle=rider.bank*.82+wobble+carve;
    const centerY=rider.y+rider.jump+size*.095+Math.sin(now*.0055)*.9;
    ctx.save();ctx.translate(rider.x,centerY);ctx.rotate(angle);ctx.scale(rider.face,1);
    // Active bottom card starts underneath the main deck and PEELS backwards.
    if(isMoving&&engine.hz>1){
      const peel=phase*phase*(3-2*phase);
      drawCard(-w*.40-peel*w*.21,h*.23+peel*4,
        size*.185*(1-.08*peel),-.22-peel*.26,
        .85*(1-.25*peel),.65);
    }
    // The high-resolution illustration itself shows dozens of IDENTIFIABLE
    // overlapping blue cards, complete with white edges and round emblems.
    const swell=1+Math.sin(now*.008)*.003;
    // Preserve crisp card borders: do not shear or warp the original illustration.
    ctx.drawImage(deck,-w*.52,-h*.61,w*swell,h);
    // Replenishment: a fresh back becomes visible on the upper front as each
    // bottom card goes flying. The board NEVER visually loses thickness.
    if(isMoving&&engine.hz>1){
      const rise=1-phase;
      const t=Math.sin(Math.PI*phase);
      drawCard(w*.33+rise*w*.14,-h*.30+rise*2,
        size*.175,-.12+.10*phase,.36*t,.68);
    }
    ctx.restore();
  }
  function drawMascotAndVfx(now,size,frame){
    ctx.save();ctx.translate(rider.x,rider.y+rider.jump);
    const movement=rider.state!=='idle';
    const idleBreath=Math.sin(now*.0049)*1.35;
    const bob=movement?Math.sin(now*.010)*(rider.state==='boost'?.8:1.35):idleBreath;
    const bankBody=rider.bank*.69+(rider.state==='boost'?-.036:0);
    const squash=rider.state==='land'?.95:rider.state==='boost'?.96:1;
    rider.squash=approach(rider.squash,squash,11,.016);
    ctx.translate(0,bob);
    ctx.rotate(bankBody);
    ctx.scale(rider.face,rider.squash);
    // The mascot has no board baked in: any tilt stays aligned with its independent deck.
    drawAtlas('body',frame,0,0,size);
    // FX is drawn procedurally, avoiding any blue confetti covering the cards.
    ctx.restore();
  }
  function frame(now){
    const dt=clamp((now-(last||now))/1000,0,.045);last=now;
    if(document.hidden){requestAnimationFrame(frame);return;}
    if(now-cursor.t>185){
      cursor.vx*=Math.exp(-dt*13);cursor.vy*=Math.exp(-dt*13);
      cursor.heading=null;
    }
    // Substantial lag but no oscillatory overshoot or sudden snapping.
    const w=8.1;
    rider.vx+=((cursor.x-rider.x)*w*w-2*w*rider.vx)*dt;
    rider.vy+=((cursor.y-rider.y)*w*w-2*w*rider.vy)*dt;
    rider.x+=rider.vx*dt;rider.y+=rider.vy*dt;
    if(Math.abs(cursor.vx)>60)rider.face=cursor.vx>=0?1:-1;
    chooseState(now);
    let lift=0;
    if(rider.jumpStarted&&rider.state==='jump'){
      const t=clamp((now-rider.jumpStarted)/480,0,1);
      lift=-Math.sin(t*Math.PI*.8)*46;
    } else if(rider.state==='land'){
      const t=clamp((now-rider.landStarted)/300,0,1);
      lift=-24*(1-t)*(1-t)+(t<.21?7*Math.sin(Math.PI*t/.21):0);
    }
    rider.jump=approach(rider.jump,lift,rider.state==='land'?13:9,dt);
    const bankTarget=rider.state==='turn'?rider.turnSign*.29:
      rider.state==='boost'?-.09:clamp(cursor.vx/1900,-.09,.09);
    rider.bank=approach(rider.bank,bankTarget,rider.state==='turn'?12:7,dt);
    const size=scaleSize();
    updateEngine(now,dt,size);
    ctx.clearRect(0,0,vw,vh);
    drawDetached(now,dt);
    const art=whichFrame(now);lastFrame=art;
    drawBoardMechanism(now,size);
    drawMascotAndVfx(now,size,art);
    requestAnimationFrame(frame);
  }
  // Non-invasive QA hooks: visible cursor remains native and clickable.
  window.LemrixSurf={getState:()=>({state:rider.state,frame:lastFrame,cards:particles.length,totalEjected:engine.produced,
    ejectionHz:Number(engine.hz.toFixed(2)),size:scaleSize(),board:'individual-trading-card-stack',velocity:Math.round(Math.hypot(rider.vx,rider.vy)),loaded:Object.fromEntries(Object.entries(images).map(([k,v])=>[k,!!v.naturalWidth]))})};
  requestAnimationFrame(frame);
})();
</script></body></html>
