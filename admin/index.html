<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f8f4"><meta name="robots" content="noindex">
<title>Stockroom · Lemrix TCG</title><link rel="icon" href="/assets/lemrix-logo.webp">
<style>
@font-face{font-family:DM;src:url('/assets/dm-sans-500.woff2');font-weight:500;font-display:swap}
@font-face{font-family:DM;src:url('/assets/dm-sans-700.woff2');font-weight:700;font-display:swap}
@font-face{font-family:Barlow;src:url('/shop/barlow-display.woff2');font-weight:800;font-display:swap}
:root{--ink:#19244a;--muted:#596276;--line:#d8dce3;--tint:#edf3fb;--paper:#f8f8f4;color:var(--ink);background:var(--paper);font:500 16px/1.45 DM,system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #3672d1;outline-offset:3px}button:disabled{opacity:.55;cursor:wait}[hidden]{display:none!important}
header{background:#fff;border-bottom:1px solid var(--line)}header nav{margin:auto;max-width:990px;min-height:78px;display:flex;align-items:center;gap:18px;padding:12px 24px}.brand{display:inline-flex;gap:16px;align-items:center;text-decoration:none}.brand img{width:66px;height:46px;object-fit:contain}.brand span{border-left:1px solid var(--line);padding-left:16px;font-weight:700}.store-link{margin-left:auto;font-size:.94rem;text-underline-offset:4px}.quiet{border:0;background:none;padding:7px 0;text-decoration:underline;text-underline-offset:4px;font-size:.94rem}
main{max-width:920px;margin:0 auto;padding:36px 24px 70px}h1,h2,p{margin:0}h1{font:800 clamp(2.4rem,6vw,3.6rem)/1 Barlow,DM,sans-serif;letter-spacing:-.025em}h2{font-size:1.1rem}small,.sub{font-size:.88rem;color:var(--muted)}label{display:grid;gap:6px;font-size:.94rem;font-weight:700}input,select,textarea{display:block;min-width:0;width:100%;border:1px solid #a6afbe;border-radius:8px;padding:10px 12px;background:white;font-weight:500}textarea{resize:vertical}button.primary,button.secondary{border-radius:999px;padding:10px 20px;border:1px solid var(--ink);font-weight:700;min-height:44px}.primary{color:white;background:var(--ink)}.primary:hover{background:#293d76}.secondary{color:var(--ink);background:#fff}.primary:active,.secondary:active{transform:translateY(1px)}#status:not(:empty){max-width:850px;margin:0 auto 16px;padding:10px 14px;border-left:3px solid #406b9e;background:var(--tint);border-radius:5px}
.login-card{margin:clamp(20px,7vh,76px) auto 0;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 12px 34px #19244a0a}.login-head{position:relative;min-height:115px;background:#ddeafa;padding:28px;display:flex;align-items:center;isolation:isolate}.login-head h1{max-width:70%;font-size:3rem}.login-head img{position:absolute;right:18px;bottom:4px;width:94px;height:100px;object-fit:contain;z-index:-1}.login-body,.form-body{display:grid;gap:18px;padding:26px}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.title-row .sub{margin-top:5px}.list-card,.edit-card{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden}.search-wrap{padding:14px;border-bottom:1px solid var(--line)}.search-wrap input{background:#f7f8fa;border-color:var(--line)}.product{display:grid;grid-template-columns:56px minmax(0,1fr) auto 16px;gap:15px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:white;text-align:left;padding:12px 20px;min-height:74px}.product:last-child{border-bottom:0}.product:hover,.product:focus-visible{background:#f2f6fc}.product img{width:52px;height:52px;object-fit:contain;border-radius:7px;background:#f5f5f2}.product strong,.product small{display:block}.product .inventory{font-size:.88rem;color:var(--muted)}.chev{width:8px;height:8px;border-top:2px solid;border-right:2px solid;transform:rotate(45deg)}.empty{padding:24px;text-align:center;color:var(--muted)}.back{margin-bottom:16px}.edit-card{max-width:760px}.form-body{padding:clamp(16px,3vw,30px);gap:18px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(175px,100%),1fr));gap:14px}.photo-area{display:grid;grid-template-columns:82px minmax(0,1fr);gap:14px;align-items:center}.frame{display:grid;place-items:center;width:82px;height:93px;border-radius:8px;background:var(--tint);color:var(--muted)}.frame img{display:block;width:100%;height:100%;object-fit:contain}.frame span{font-size:1.5rem}.photo-area small{font-weight:500}.photo-area input{font-size:.9rem;padding:6px}input::file-selector-button{background:var(--tint);border:0;color:var(--ink);border-radius:4px;padding:6px 8px;cursor:pointer}.actions{border-top:1px solid var(--line);padding:15px clamp(16px,3vw,30px);display:flex;justify-content:flex-end;gap:12px;align-items:center}.actions .sub{margin-right:auto}
@media(max-width:550px){header nav{min-height:64px;gap:10px;padding:8px 15px}.brand{gap:8px}.brand img{width:46px}.brand span{padding-left:8px}.store-link,.quiet{font-size:.86rem}main{padding:22px 14px 48px}.title-row{gap:8px}.product{grid-template-columns:44px minmax(0,1fr) auto 8px;gap:9px;padding:10px 12px}.product img{width:42px;height:48px}.login-body{padding:22px}.product .inventory{font-size:.78rem}.actions .sub{max-width:48%}.photo-area{grid-template-columns:58px minmax(0,1fr)}.frame{width:58px;height:77px}}
.photo-tools{display:grid;gap:12px}.photo-tools img{max-height:360px;max-width:100%;margin:auto;object-fit:contain}.photo-tools label{display:flex;align-items:center;gap:8px}.photo-tools input{width:auto}.account{margin-top:20px;background:#fff;border:1px solid var(--line);padding:14px 18px;border-radius:12px}.account summary{cursor:pointer;font-weight:700}.account p{margin:10px 0}
</style>
</head><body>
<header><nav aria-label="Stockroom"><a class="brand" href="/admin/"><img src="/assets/lemrix-wordmark.webp" alt="Lemrix TCG"><span>Stockroom</span></a><a class="store-link" href="/shop/">View store</a><button type="button" class="quiet" id="logout" hidden>Sign out</button></nav></header>
<main><p id="status" role="status" aria-live="polite"></p>
<form id="login" class="login-card"><div class="login-head"><h1>Admin sign in</h1><img src="/assets/idle-still.webp" alt=""></div><div class="login-body"><label>Username<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Sign in</button></div></form>
<section id="inventory" hidden><div class="title-row"><div><h1 tabindex="-1" id="inventory-title">Inventory</h1><p id="count" class="sub"></p></div><button class="primary" id="add" type="button">Add product</button></div><div class="list-card"><div class="search-wrap"><input type="search" id="search" aria-label="Search products" placeholder="Search products"></div><div id="items"></div><p class="empty" id="empty" hidden>No matching products.</p></div><details class="account"><summary>Admin account</summary><p id="account-info"></p><button type="button" class="secondary" id="logout-all">Sign out on all devices</button></details></section>
<section id="editing" hidden><button id="back" class="quiet back" type="button">Back to inventory</button><div class="title-row"><h1 tabindex="-1" id="title">Edit product</h1></div>
<form id="editor" class="edit-card"><div class="form-body"><label>Product name<input name="name" maxlength="100" required></label><label>Description<textarea name="description" rows="3" maxlength="3000" required></textarea></label><div class="cols"><label>Category<select name="category"><option>Singles</option><option>Packs</option><option>Accessories</option></select></label><label>Stock quantity<input name="quantity" type="number" inputmode="numeric" min="0" max="1000000" step="1" required></label></div><div id="prices" class="prices"></div><div class="photo-area"><div class="frame"><img id="photo" alt="Product preview" hidden><span id="placeholder" aria-hidden="true">＋</span></div><label>Product photo<input type="file" name="photo" accept="image/jpeg,image/png,image/webp"><small>JPEG, PNG or WebP · 20 MB max</small></label></div><button type="button" class="secondary" id="take-photo">Take a photo</button><input type="file" id="camera" accept="image/*" capture="environment" hidden><div class="photo-tools" id="photo-tools" hidden><label><input id="balance" type="checkbox" checked>Balance lighting and colours</label><button type="button" class="secondary" id="rotate">Rotate 90°</button><img id="proof" alt="Photo as it will appear in the shop"><small>Keep all four card edges in the shot. Compare the preview with the card before saving.</small></div></div><div class="actions"><span id="form-status" class="sub" role="status"></span><button class="primary" id="save">Save product</button></div></form></section>
</main><script defer src="/admin/app.js"></script></body></html>
